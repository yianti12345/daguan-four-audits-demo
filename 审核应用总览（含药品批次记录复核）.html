:root{--paper:#ffffff;--canvas:#f5f5f5;--ink:rgba(0,0,0,0.88);--secondary:rgba(0,0,0,0.65);--line:#f0f0f0;--primary:#1677ff;--tint:#e6f4ff;--font:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol',
'Noto Color Emoji';--radius:8px;--pad:24px;--gap:16px;--titleSize:30px;--cardTitle:20px;--bodySize:14px}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--ink); font: var(--bodySize)/1.65 var(--font); }
#screen { width: min(100% - 2 * var(--pad), 1200px); margin: 0 auto; padding: clamp(40px, 9vh, 88px) 0; }
h1 { font-size: var(--titleSize); line-height: 1.35; letter-spacing: .01em; margin: 0 0 var(--pad); font-weight: 600; }
.share-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--gap); }
.share-card { display: block; min-width: 0; text-decoration: none; color: inherit; border-radius: var(--radius); }
.share-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
.share-card .ant-pro-card { height: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
.share-card:hover .ant-pro-card, .share-card:focus-visible .ant-pro-card { border-color: var(--primary); }
.share-card .ant-pro-card-body { display: flex; flex-direction: column; padding: var(--pad); }
.card-heading { display: flex; align-items: center; gap: 12px; color: var(--secondary); }
.object-icon { display: grid; place-items: center; width: 44px; height: 44px; font-size: 23px; border-radius: var(--radius); }
.tender { color: var(--ifas-category-violet-ink); background: var(--ifas-category-violet-bg); }
.travel { color: var(--ifas-category-teal-ink); background: var(--ifas-category-teal-bg); }
.batch { color: var(--ifas-category-teal-ink); background: var(--ifas-category-teal-bg); }
.order { color: var(--primary); background: var(--tint); }
h2 { color: var(--ink); font-size: var(--cardTitle); line-height: 1.4; margin: var(--pad) 0 8px; font-weight: 600; }
p { margin: 0; color: var(--secondary); line-height: 1.7; flex: 1; }
.card-action { display: flex; align-items: center; gap: 8px; margin-top: var(--pad); padding-top: var(--gap); border-top: 1px solid var(--line); color: var(--primary); font-weight: 500; }
@media(max-width: 780px) { .share-grid { grid-template-columns: 1fr; } #screen { max-width: 560px; padding-block: 32px; } h2 { margin-top: 16px; } }
@media(max-width: 480px) { #screen { width: calc(100% - 32px); } }
